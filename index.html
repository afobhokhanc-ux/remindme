<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>200 Level Cybersecurity Timetable</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            50: '#eefbfb',
                            100: '#d5f6f6',
                            400: '#22d3ee',
                            500: '#06b6d4',
                            600: '#0891b2',
                            900: '#091e2e',
                            950: '#050f19',
                        },
                        matrix: '#00ff66',
                        neonPurple: '#a855f7',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050f19;
            color: #e2e8f0;
        }
        .cyber-grid {
            background-image: radial-gradient(rgba(6, 182, 212, 0.12) 1px, transparent 0);
            background-size: 24px 24px;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(6, 182, 212, 0.18);
        }
        .glass-panel-active {
            background: rgba(8, 145, 178, 0.15);
            border: 1px solid rgba(34, 211, 238, 0.5);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.25);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #050f19;
        }
        ::-webkit-scrollbar-thumb {
            background: #0891b2;
            border-radius: 3px;
        }
    </style>
</head>
<body class="cyber-grid min-h-screen flex flex-col justify-between selection:bg-cyber-500 selection:text-black pb-12">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 glass-panel border-b border-cyber-600/30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
            
            <!-- Branding -->
            <div class="flex items-center space-x-3">
                <div class="p-2 rounded-xl bg-cyber-500/10 border border-cyber-400/40 text-cyber-400 shadow-[0_0_10px_rgba(34,211,238,0.2)]">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        200L Cybersecurity
                        <span class="text-xs font-mono font-medium px-2 py-0.5 rounded bg-cyber-500/20 text-cyber-400 border border-cyber-500/30">BU-CYB</span>
                    </h1>
                    <p class="text-xs text-slate-400">Class Schedule & Reminder Hub</p>
                </div>
            </div>

            <!-- Live Clock & Status -->
            <div class="flex items-center space-x-4">
                <div class="text-right hidden sm:block">
                    <div id="liveClock" class="font-mono text-sm font-semibold text-cyber-400 tracking-wider">00:00:00 AM</div>
                    <div id="liveDate" class="text-xs text-slate-400">Monday, Oct 24</div>
                </div>

                <!-- Notifications Toggle Button -->
                <button id="notifToggleBtn" onclick="toggleNotifications()" class="flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-all">
                    <i data-lucide="bell" id="bellIcon" class="w-4 h-4 text-cyber-400"></i>
                    <span id="notifStatusText">Enable Alerts</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full">

        <!-- Top Banner / Current Status Card -->
        <section class="mb-8">
            <div id="statusCard" class="glass-panel rounded-2xl p-5 md:p-6 relative overflow-hidden">
                <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-cyber-500/10 rounded-full blur-3xl pointer-events-none"></div>
                
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 relative z-10">
                    <div class="flex items-start space-x-4">
                        <div class="p-3 rounded-xl bg-cyber-500/10 border border-cyber-400/30 text-cyber-400 mt-1">
                            <i data-lucide="radio" class="w-6 h-6 animate-pulse"></i>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="uppercase tracking-widest text-[10px] font-mono font-bold text-cyber-400 px-2 py-0.5 rounded bg-cyber-400/10 border border-cyber-400/20">Live Status</span>
                                <span id="currentDayBadge" class="text-xs text-slate-400">Today</span>
                            </div>
                            <h2 id="currentClassTitle" class="text-xl md:text-2xl font-bold text-white mt-1">Loading Schedule...</h2>
                            <p id="currentClassMeta" class="text-sm text-slate-300 mt-1 flex flex-wrap items-center gap-x-4 gap-y-1">
                                <span><i data-lucide="clock" class="inline w-3.5 h-3.5 mr-1 text-cyber-400"></i>--:--</span>
                                <span><i data-lucide="map-pin" class="inline w-3.5 h-3.5 mr-1 text-cyber-400"></i>--</span>
                            </p>
                        </div>
                    </div>

                    <!-- Next Class Countdown / Filter Controls -->
                    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3 border-t md:border-t-0 md:border-l border-slate-700/60 pt-3 md:pt-0 md:pl-6">
                        <div class="text-left md:text-right">
                            <span class="text-xs text-slate-400 font-mono">NEXT CLASS IN</span>
                            <div id="countdownTimer" class="font-mono text-xl font-bold text-cyber-400 tracking-wider">--h --m</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Controls Bar: View Toggle & Group Filter -->
        <section class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            
            <!-- Group Filters -->
            <div class="flex items-center space-x-1.5 bg-slate-900/80 p-1 rounded-xl border border-slate-800">
                <span class="text-xs text-slate-400 px-2.5 font-mono">GROUP:</span>
                <button onclick="setGroupFilter('all')" id="btn-group-all" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all bg-cyber-500 text-black font-semibold shadow">
                    All
                </button>
                <button onclick="setGroupFilter('A')" id="btn-group-A" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white transition-all">
                    Group A
                </button>
                <button onclick="setGroupFilter('B')" id="btn-group-B" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white transition-all">
                    Group B
                </button>
            </div>

            <!-- View Switcher & Notification Lead Time Settings -->
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center space-x-2 bg-slate-900/80 px-3 py-1.5 rounded-xl border border-slate-800 text-xs">
                    <i data-lucide="bell-ring" class="w-3.5 h-3.5 text-cyber-400"></i>
                    <span class="text-slate-400">Alert me:</span>
                    <select id="reminderOffset" onchange="updateReminderOffset(this.value)" class="bg-slate-800 text-white rounded px-2 py-0.5 border border-slate-700 focus:outline-none focus:border-cyber-400">
                        <option value="5">5 mins before</option>
                        <option value="10" selected>10 mins before</option>
                        <option value="15">15 mins before</option>
                        <option value="30">30 mins before</option>
                    </select>
                </div>

                <!-- View Switcher (Daily / Weekly Grid) -->
                <div class="flex items-center bg-slate-900/80 p-1 rounded-xl border border-slate-800">
                    <button onclick="setViewMode('daily')" id="btn-view-daily" class="view-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white transition-all flex items-center space-x-1.5">
                        <i data-lucide="calendar-day" class="w-3.5 h-3.5"></i>
                        <span>Daily</span>
                    </button>
                    <button onclick="setViewMode('weekly')" id="btn-view-weekly" class="view-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-cyber-500 text-black font-semibold shadow flex items-center space-x-1.5">
                        <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                        <span>Weekly Grid</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Dynamic Day Navigation (For Daily View) -->
        <div id="dayNav" class="hidden mb-6 overflow-x-auto pb-2">
            <div class="flex space-x-2 min-w-max">
                <button onclick="setSelectedDay('MONDAY')" class="day-tab px-4 py-2 rounded-xl border border-slate-800 text-xs font-medium transition-all text-slate-400 bg-slate-900/60" id="tab-MONDAY">Monday</button>
                <button onclick="setSelectedDay('TUESDAY')" class="day-tab px-4 py-2 rounded-xl border border-slate-800 text-xs font-medium transition-all text-slate-400 bg-slate-900/60" id="tab-TUESDAY">Tuesday</button>
                <button onclick="setSelectedDay('WEDNESDAY')" class="day-tab px-4 py-2 rounded-xl border border-slate-800 text-xs font-medium transition-all text-slate-400 bg-slate-900/60" id="tab-WEDNESDAY">Wednesday</button>
                <button onclick="setSelectedDay('THURSDAY')" class="day-tab px-4 py-2 rounded-xl border border-slate-800 text-xs font-medium transition-all text-slate-400 bg-slate-900/60" id="tab-THURSDAY">Thursday</button>
                <button onclick="setSelectedDay('FRIDAY')" class="day-tab px-4 py-2 rounded-xl border border-slate-800 text-xs font-medium transition-all text-slate-400 bg-slate-900/60" id="tab-FRIDAY">Friday</button>
            </div>
        </div>

        <!-- Weekly Grid / Daily Timetable View Container -->
        <section id="timetableContainer" class="transition-all duration-300">
            <!-- Rendered via JS -->
        </section>

    </main>

    <!-- Modal for Class Details & Notes -->
    <div id="classModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm hidden">
        <div class="glass-panel w-full max-w-md rounded-2xl p-6 border border-cyber-400/30 relative shadow-2xl animate-in fade-in zoom-in-95 duration-150">
            <!-- Modal Header -->
            <div class="flex items-start justify-between pb-4 border-b border-slate-800">
                <div>
                    <span id="modalCourseCode" class="font-mono text-xs font-bold text-cyber-400 px-2 py-0.5 rounded bg-cyber-500/10 border border-cyber-500/30">COURSE CODE</span>
                    <h3 id="modalCourseTitle" class="text-xl font-bold text-white mt-1">Course Title</h3>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Modal Info Body -->
            <div class="py-4 space-y-3.5">
                <div class="flex items-center text-sm text-slate-300">
                    <i data-lucide="clock" class="w-4 h-4 text-cyber-400 mr-2.5"></i>
                    <span id="modalTime" class="font-mono">--:--</span>
                </div>
                <div class="flex items-center text-sm text-slate-300">
                    <i data-lucide="map-pin" class="w-4 h-4 text-cyber-400 mr-2.5"></i>
                    <span id="modalLocation">--</span>
                </div>
                <div class="flex items-center text-sm text-slate-300">
                    <i data-lucide="users" class="w-4 h-4 text-cyber-400 mr-2.5"></i>
                    <span id="modalGroup">All Groups</span>
                </div>

                <!-- Custom Personal Notes Section -->
                <div class="pt-2">
                    <label class="block text-xs font-medium text-slate-400 mb-1.5 flex items-center justify-between">
                        <span>PERSONAL NOTES & TASKS</span>
                        <span class="text-[10px] text-cyber-400 font-mono">AUTO-SAVED</span>
                    </label>
                    <textarea id="modalNotes" rows="4" placeholder="Add room specifics, assignment deadlines, lab requirements..." class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-cyber-400 focus:ring-1 focus:ring-cyber-400 transition-all"></textarea>
                </div>
            </div>

            <!-- Modal Actions -->
            <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-800">
                <button onclick="saveNotes()" class="w-full py-2.5 rounded-xl bg-cyber-500 hover:bg-cyber-400 text-black font-semibold text-xs transition-all flex items-center justify-center space-x-1.5">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    <span>Save Note</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Toast Alert -->
    <div id="toastAlert" class="fixed bottom-5 right-5 z-50 glass-panel border border-cyber-400/50 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 translate-y-20 opacity-0 transition-all duration-300 max-w-sm">
        <div class="p-2 rounded-lg bg-cyber-500/20 text-cyber-400">
            <i data-lucide="bell-ring" class="w-5 h-5"></i>
        </div>
        <div>
            <h4 id="toastTitle" class="text-xs font-bold text-cyber-400 font-mono uppercase">Class Alert</h4>
            <p id="toastMessage" class="text-xs text-slate-200 mt-0.5">Your class starts in 10 minutes!</p>
        </div>
    </div>

    <!-- App Logic Script -->
    <script>
        // Timetable Data Structure based strictly on image specifications
        const scheduleData = [
            // MONDAY
            { id: "mon-1", day: "MONDAY", startTime: "16:00", endTime: "17:50", timeLabel: "4:00 PM - 5:50 PM", code: "ENT-211", title: "Entrepreneurship and Innov", group: "ALL", location: "General Lecture Room" },

            // TUESDAY
            { id: "tue-1", day: "TUESDAY", startTime: "08:00", endTime: "10:00", timeLabel: "8:00 AM - 10:00 AM", code: "CYB213", title: "CYB213 Grp A", group: "A", location: "Cybersecurity Lab" },
            { id: "tue-2", day: "TUESDAY", startTime: "10:00", endTime: "11:00", timeLabel: "10:00 AM - 11:00 AM", code: "BU-GST 221", title: "Intro to Agric", group: "ALL", location: "BU-GST Hall" },
            { id: "tue-3a", day: "TUESDAY", startTime: "11:00", endTime: "12:50", timeLabel: "11:00 AM - 12:50 PM", code: "CYB213", title: "CYB213 Grp B", group: "B", location: "Cybersecurity Lab" },
            { id: "tue-3b", day: "TUESDAY", startTime: "11:00", endTime: "12:50", timeLabel: "11:00 AM - 12:50 PM", code: "SEN201", title: "SEN201 Group A", group: "A", location: "New Horizon Room 5" },
            { id: "tue-lunch", day: "TUESDAY", startTime: "13:00", endTime: "14:00", timeLabel: "1:00 PM - 2:00 PM", code: "LUNCH", title: "LUNCH BREAK", group: "ALL", location: "Cafeteria", isBreak: true },
            { id: "tue-4", day: "TUESDAY", startTime: "14:00", endTime: "14:50", timeLabel: "2:00 PM - 2:50 PM", code: "COS201", title: "Cos201 Group A", group: "A", location: "Computer Lab" },
            { id: "tue-5a", day: "TUESDAY", startTime: "14:00", endTime: "15:50", timeLabel: "2:00 PM - 3:50 PM", code: "SEN201", title: "SEN201 GROUP B", group: "B", location: "Software Engineering Lab" },
            { id: "tue-5b", day: "TUESDAY", startTime: "16:00", endTime: "18:00", timeLabel: "4:00 PM - 6:00 PM", code: "BU-COS 209", title: "BU-COS 209 Group A", group: "A", location: "New Horizons (4-6pm!!)" },

            // WEDNESDAY
            { id: "wed-1", day: "WEDNESDAY", startTime: "09:00", endTime: "10:00", timeLabel: "9:00 AM - 10:00 AM", code: "BU-COS 209", title: "BU-COS 209 Group B", group: "B", location: "New Horizons" },
            { id: "wed-lunch", day: "WEDNESDAY", startTime: "13:00", endTime: "14:00", timeLabel: "1:00 PM - 2:00 PM", code: "LUNCH", title: "LUNCH BREAK", group: "ALL", location: "Cafeteria", isBreak: true },
            { id: "wed-2", day: "WEDNESDAY", startTime: "14:00", endTime: "15:50", timeLabel: "2:00 PM - 3:50 PM", code: "BU-GST 215", title: "Adventist Heritage", group: "ALL", location: "BU-GST 215" },
            { id: "wed-3", day: "WEDNESDAY", startTime: "16:00", endTime: "17:50", timeLabel: "4:00 PM - 5:50 PM", code: "COS201", title: "COS201 Grp B", group: "B", location: "New Horizon Room 3" },

            // THURSDAY
            { id: "thu-1", day: "THURSDAY", startTime: "10:00", endTime: "11:00", timeLabel: "10:00 AM - 11:00 AM", code: "BU-GST 215", title: "Adventist Heritage", group: "ALL", location: "BU-GST 215" },
            { id: "thu-2", day: "THURSDAY", startTime: "11:00", endTime: "12:50", timeLabel: "11:00 AM - 12:50 PM", code: "CYB213", title: "CYB213 Grp A", group: "A", location: "Cybersecurity Lab" },
            { id: "thu-lunch", day: "THURSDAY", startTime: "13:00", endTime: "14:00", timeLabel: "1:00 PM - 2:00 PM", code: "LUNCH", title: "LUNCH BREAK", group: "ALL", location: "Cafeteria", isBreak: true },
            { id: "thu-3", day: "THURSDAY", startTime: "14:00", endTime: "15:50", timeLabel: "2:00 PM - 3:50 PM", code: "CYB213", title: "CYB213 Grp B", group: "B", location: "Cybersecurity Lab" },

            // FRIDAY
            { id: "fri-free", day: "FRIDAY", startTime: "08:00", endTime: "18:00", timeLabel: "All Day", code: "FREE", title: "No Lectures Scheduled", group: "ALL", location: "N/A", isBreak: true }
        ];

        const days = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];

        // State Management
        let viewMode = 'weekly'; // 'weekly' or 'daily'
        let currentGroupFilter = 'all'; // 'all', 'A', 'B'
        let selectedDay = 'MONDAY';
        let reminderOffsetMinutes = 10;
        let notificationsEnabled = false;
        let activeModalClassId = null;
        let userNotes = JSON.parse(localStorage.getItem('cyb_timetable_notes') || '{}');
        let alertedClassesToday = new Set();

        // Initialize App
        window.onload = function() {
            lucide.createIcons();
            
            // Set default selected day to today if weekday
            const todayIndex = new Date().getDay();
            if (todayIndex >= 1 && todayIndex <= 5) {
                selectedDay = days[todayIndex];
            }
            
            updateLiveClock();
            setInterval(updateLiveClock, 1000);
            
            renderView();
            checkNotificationsPermissionState();
        };

        // Clock & Status Updates
        function updateLiveClock() {
            const now = new Date();
            const clockEl = document.getElementById('liveClock');
            const dateEl = document.getElementById('liveDate');
            
            clockEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            dateEl.textContent = now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });

            updateCurrentStatus(now);
        }

        function updateCurrentStatus(now) {
            const currentDayName = days[now.getDay()];
            const currentTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            document.getElementById('currentDayBadge').textContent = currentDayName;

            // Find classes for today
            const todaysClasses = scheduleData.filter(c => c.day === currentDayName && (currentGroupFilter === 'all' || c.group === 'ALL' || c.group === currentGroupFilter) && !c.isBreak);

            let activeClass = null;
            let upcomingClass = null;
            let minDiffMinutes = Infinity;

            todaysClasses.forEach(c => {
                if (currentTimeStr >= c.startTime && currentTimeStr < c.endTime) {
                    activeClass = c;
                } else if (c.startTime > currentTimeStr) {
                    const [h, m] = c.startTime.split(':').map(Number);
                    const classTimeMinutes = h * 60 + m;
                    const nowMinutes = now.getHours() * 60 + now.getMinutes();
                    const diff = classTimeMinutes - nowMinutes;

                    if (diff < minDiffMinutes) {
                        minDiffMinutes = diff;
                        upcomingClass = c;
                    }

                    // Check for class alerts
                    if (diff <= reminderOffsetMinutes && diff > 0 && !alertedClassesToday.has(c.id)) {
                        triggerClassAlert(c, diff);
                        alertedClassesToday.add(c.id);
                    }
                }
            });

            const titleEl = document.getElementById('currentClassTitle');
            const metaEl = document.getElementById('currentClassMeta');
            const countdownEl = document.getElementById('countdownTimer');

            if (activeClass) {
                titleEl.textContent = `NOW: ${activeClass.title}`;
                titleEl.className = "text-xl md:text-2xl font-bold text-cyber-400 mt-1 animate-pulse";
                metaEl.innerHTML = `
                    <span><i data-lucide="clock" class="inline w-3.5 h-3.5 mr-1 text-cyber-400"></i>${activeClass.timeLabel}</span>
                    <span><i data-lucide="map-pin" class="inline w-3.5 h-3.5 mr-1 text-cyber-400"></i>${activeClass.location}</span>
                `;
                countdownEl.textContent = "IN PROGRESS";
            } else if (upcomingClass) {
                titleEl.textContent = `NEXT: ${upcomingClass.title}`;
                titleEl.className = "text-xl md:text-2xl font-bold text-white mt-1";
                metaEl.innerHTML = `
                    <span><i data-lucide="clock" class="inline w-3.5 h-3.5 mr-1 text-cyber-400"></i>${upcomingClass.timeLabel}</span>
                    <span><i data-lucide="map-pin" class="inline w-3.5 h-3.5 mr-1 text-cyber-400"></i>${upcomingClass.location}</span>
                `;
                
                const hrs = Math.floor(minDiffMinutes / 60);
                const mins = minDiffMinutes % 60;
                countdownEl.textContent = hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m`;
            } else {
                titleEl.textContent = currentDayName === "SATURDAY" || currentDayName === "SUNDAY" || currentDayName === "FRIDAY" ? "No further classes today 🎉" : "All classes completed for today";
                titleEl.className = "text-xl md:text-2xl font-bold text-slate-300 mt-1";
                metaEl.innerHTML = `<span><i data-lucide="check-circle" class="inline w-3.5 h-3.5 mr-1 text-emerald-400"></i>Schedule clear</span>`;
                countdownEl.textContent = "--";
            }
            lucide.createIcons();
        }

        // View Mode Switcher
        function setViewMode(mode) {
            viewMode = mode;
            document.getElementById('btn-view-daily').className = mode === 'daily' 
                ? 'view-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyber-500 text-black shadow flex items-center space-x-1.5'
                : 'view-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white transition-all flex items-center space-x-1.5';
            
            document.getElementById('btn-view-weekly').className = mode === 'weekly' 
                ? 'view-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyber-500 text-black shadow flex items-center space-x-1.5'
                : 'view-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white transition-all flex items-center space-x-1.5';

            document.getElementById('dayNav').style.display = mode === 'daily' ? 'block' : 'none';
            renderView();
        }

        // Group Filter Switcher
        function setGroupFilter(group) {
            currentGroupFilter = group;
            ['all', 'A', 'B'].forEach(g => {
                const btn = document.getElementById(`btn-group-${g}`);
                if (g === group) {
                    btn.className = 'filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyber-500 text-black shadow';
                } else {
                    btn.className = 'filter-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white transition-all';
                }
            });
            renderView();
            updateLiveClock();
        }

        function setSelectedDay(day) {
            selectedDay = day;
            ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY"].forEach(d => {
                const tab = document.getElementById(`tab-${d}`);
                if (d === day) {
                    tab.className = 'day-tab px-4 py-2 rounded-xl border border-cyber-400/50 text-xs font-bold transition-all text-cyber-400 bg-cyber-500/10 shadow-[0_0_10px_rgba(6,182,212,0.15)]';
                } else {
                    tab.className = 'day-tab px-4 py-2 rounded-xl border border-slate-800 text-xs font-medium transition-all text-slate-400 bg-slate-900/60 hover:text-white';
                }
            });
            renderView();
        }

        function updateReminderOffset(val) {
            reminderOffsetMinutes = parseInt(val, 10);
            showToast("Alert Lead Time Updated", `You will be notified ${reminderOffsetMinutes} mins before class.`);
        }

        // Notification System
        function checkNotificationsPermissionState() {
            if ("Notification" in window) {
                if (Notification.permission === "granted") {
                    notificationsEnabled = true;
                    updateNotifBtnUI(true);
                }
            }
        }

        function toggleNotifications() {
            if (!("Notification" in window)) {
                showToast("Not Supported", "Browser notifications are not supported in this browser. Simulated alerts are active.");
                return;
            }

            if (Notification.permission === "granted") {
                notificationsEnabled = !notificationsEnabled;
                updateNotifBtnUI(notificationsEnabled);
                showToast("Notifications", notificationsEnabled ? "Class reminders are enabled!" : "Notifications paused.");
            } else if (Notification.permission !== "denied") {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        notificationsEnabled = true;
                        updateNotifBtnUI(true);
                        showToast("Notifications Enabled", "You will now receive desktop reminders for lectures.");
                    }
                });
            } else {
                showToast("Permission Denied", "Notifications blocked in browser settings. Please enable manually.");
            }
        }

        function updateNotifBtnUI(enabled) {
            const statusText = document.getElementById('notifStatusText');
            const bellIcon = document.getElementById('bellIcon');
            if (enabled) {
                statusText.textContent = "Alerts On";
                bellIcon.className = "w-4 h-4 text-matrix";
            } else {
                statusText.textContent = "Enable Alerts";
                bellIcon.className = "w-4 h-4 text-cyber-400";
            }
        }

        function triggerClassAlert(classItem, minutesLeft) {
            const title = `Class Reminder: ${classItem.code}`;
            const body = `${classItem.title} starts in ${minutesLeft} mins at ${classItem.location}!`;

            showToast(title, body);

            if (notificationsEnabled && Notification.permission === "granted") {
                new Notification(title, {
                    body: body,
                    icon: "https://cdn-icons-png.flaticon.com/512/2092/2092663.png"
                });
            }
        }

        function showToast(title, msg) {
            const toast = document.getElementById('toastAlert');
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastMessage').textContent = msg;

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 4500);
        }

        // Render Timetable Grid or Daily Cards
        function renderView() {
            const container = document.getElementById('timetableContainer');
            container.innerHTML = '';

            const filteredData = scheduleData.filter(item => {
                if (currentGroupFilter === 'all') return true;
                return item.group === 'ALL' || item.group === currentGroupFilter;
            });

            if (viewMode === 'weekly') {
                renderWeeklyGrid(container, filteredData);
            } else {
                renderDailyView(container, filteredData);
            }
            lucide.createIcons();
        }

        function renderWeeklyGrid(container, data) {
            const gridDays = ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY"];
            
            let gridHTML = `<div class="grid grid-cols-1 md:grid-cols-5 gap-4">`;

            gridDays.forEach(day => {
                const dayClasses = data.filter(c => c.day === day);
                const isToday = days[new Date().getDay()] === day;

                gridHTML += `
                    <div class="glass-panel rounded-2xl p-4 flex flex-col ${isToday ? 'border-cyber-400/60 shadow-[0_0_15px_rgba(6,182,212,0.15)]' : ''}">
                        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
                            <h3 class="font-bold text-sm text-white font-mono flex items-center gap-1.5">
                                ${day}
                                ${isToday ? '<span class="w-2 h-2 rounded-full bg-cyber-400 animate-ping"></span>' : ''}
                            </h3>
                            <span class="text-[10px] text-slate-400">${dayClasses.length} sessions</span>
                        </div>
                        <div class="space-y-3 flex-grow">
                `;

                if (dayClasses.length === 0) {
                    gridHTML += `
                        <div class="text-center py-8 text-slate-500 text-xs italic">
                            No classes for Group ${currentGroupFilter.toUpperCase()}
                        </div>
                    `;
                } else {
                    dayClasses.forEach(item => {
                        const hasNote = userNotes[item.id] && userNotes[item.id].trim().length > 0;
                        gridHTML += renderClassCardHTML(item, hasNote, false);
                    });
                }

                gridHTML += `
                        </div>
                    </div>
                `;
            });

            gridHTML += `</div>`;
            container.innerHTML = gridHTML;
        }

        function renderDailyView(container, data) {
            const dayClasses = data.filter(c => c.day === selectedDay);

            if (dayClasses.length === 0) {
                container.innerHTML = `
                    <div class="glass-panel rounded-2xl p-12 text-center max-w-md mx-auto">
                        <i data-lucide="coffee" class="w-12 h-12 text-cyber-400/40 mx-auto mb-3"></i>
                        <h3 class="text-lg font-bold text-white">No Classes Scheduled</h3>
                        <p class="text-xs text-slate-400 mt-1">Take a break or review your notes for other courses!</p>
                    </div>
                `;
                return;
            }

            let listHTML = `<div class="max-w-2xl mx-auto space-y-3.5">`;
            dayClasses.forEach(item => {
                const hasNote = userNotes[item.id] && userNotes[item.id].trim().length > 0;
                listHTML += renderClassCardHTML(item, hasNote, true);
            });
            listHTML += `</div>`;
            container.innerHTML = listHTML;
        }

        function renderClassCardHTML(item, hasNote, isDetailed) {
            if (item.isBreak) {
                return `
                    <div class="p-3 rounded-xl bg-slate-900/40 border border-slate-800/80 text-center text-xs text-slate-400 flex items-center justify-center space-x-2">
                        <i data-lucide="utensils" class="w-3.5 h-3.5 text-cyber-400"></i>
                        <span class="font-medium">${item.title} (${item.timeLabel})</span>
                    </div>
                `;
            }

            const groupBadgeColor = item.group === 'A' 
                ? 'bg-purple-500/10 text-purple-400 border-purple-500/30' 
                : item.group === 'B' 
                ? 'bg-amber-500/10 text-amber-400 border-amber-500/30'
                : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';

            return `
                <div onclick="openModal('${item.id}')" class="group relative p-3.5 rounded-xl glass-panel hover:glass-panel-active cursor-pointer transition-all duration-200 border border-slate-800 hover:border-cyber-400/50">
                    <div class="flex items-start justify-between gap-2">
                        <div>
                            <div class="flex items-center gap-1.5">
                                <span class="font-mono text-[10px] font-bold px-1.5 py-0.5 rounded ${groupBadgeColor} border">
                                    ${item.group === 'ALL' ? 'ALL' : 'GRP ' + item.group}
                                </span>
                                <span class="font-mono text-xs text-cyber-400 font-semibold">${item.code}</span>
                            </div>
                            <h4 class="text-sm font-bold text-white group-hover:text-cyber-400 transition-colors mt-1 line-clamp-1">${item.title}</h4>
                        </div>
                        ${hasNote ? '<i data-lucide="sticky-note" class="w-4 h-4 text-amber-400 flex-shrink-0" title="Has Notes"></i>' : ''}
                    </div>
                    
                    <div class="mt-3 pt-2.5 border-t border-slate-800/80 flex flex-wrap items-center justify-between text-xs text-slate-400 gap-y-1">
                        <span class="flex items-center"><i data-lucide="clock" class="w-3 h-3 mr-1 text-slate-400"></i>${item.timeLabel}</span>
                        <span class="flex items-center text-slate-300 font-medium"><i data-lucide="map-pin" class="w-3 h-3 mr-1 text-cyber-400"></i>${item.location}</span>
                    </div>
                </div>
            `;
        }

        // Modal Operations
        function openModal(classId) {
            const item = scheduleData.find(c => c.id === classId);
            if (!item || item.isBreak) return;

            activeModalClassId = classId;
            document.getElementById('modalCourseCode').textContent = item.code;
            document.getElementById('modalCourseTitle').textContent = item.title;
            document.getElementById('modalTime').textContent = `${item.day} • ${item.timeLabel}`;
            document.getElementById('modalLocation').textContent = item.location;
            document.getElementById('modalGroup').textContent = item.group === 'ALL' ? 'All Groups' : `Group ${item.group}`;
            document.getElementById('modalNotes').value = userNotes[classId] || '';

            document.getElementById('classModal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('classModal').classList.add('hidden');
            activeModalClassId = null;
        }

        function saveNotes() {
            if (!activeModalClassId) return;
            const text = document.getElementById('modalNotes').value;
            userNotes[activeModalClassId] = text;
            localStorage.setItem('cyb_timetable_notes', JSON.stringify(userNotes));
            
            closeModal();
            renderView();
            showToast("Notes Saved", "Your notes for this class have been stored.");
        }
    </script>
</body>
</html>
